name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip every zip file in the repo root
        run: |
          ls -la
          for f in *.zip; do
            echo "Extracting: $f"
            unzip -o "$f"
            rm "$f"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update project files" || echo "Nothing to commit"
          git push
