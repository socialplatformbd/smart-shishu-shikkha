<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অফলাইন মোড | স্মার্ট শিশু শিক্ষা</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #F0FDF4;
      color: #1F2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border: 3px solid #BBF7D0;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      color: #065F46;
      margin-bottom: 8px;
    }
    p {
      color: #4B5563;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #10B981;
      color: #FFFFFF;
      padding: 14px 28px;
      border-radius: 9999px;
      font-weight: 700;
      text-decoration: none;
      font-size: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .badge {
      display: inline-block;
      margin-top: 18px;
      font-size: 13px;
      color: #047857;
      background: #D1FAE5;
      padding: 6px 14px;
      border-radius: 9999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌿🎒</div>
    <h1>তুমি এখন অফলাইনে আছো!</h1>
    <p>ইন্টারনেট সংযোগ নেই, তবে চিন্তা করো না! স্মার্ট শিশু শিক্ষার সংরক্ষিত পাঠ, বর্ণমালা এবং কুইজ অফলাইনেও সবসময় শেখা যায়।</p>
    <a href="/" class="btn">অ্যাপে ফিরে যাও 🚀</a>
    <div>
      <span class="badge">Made by Mohammad Rakib</span>
    </div>
  </div>
</body>
</html>
